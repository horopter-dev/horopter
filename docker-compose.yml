services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: horopter
      POSTGRES_PASSWORD: horopter
      POSTGRES_DB: horopter
    ports:
      - "5432:5432"
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. postgres:18 moved
      # PGDATA to /var/lib/postgresql/18/docker and the image declares its VOLUME at the
      # parent, so the older path — which every pre-18 example uses — would mount an empty
      # directory Postgres ignores. The volume would appear in `docker volume ls`, look
      # correct, and protect nothing.
      #
      # Naming it is the point. Without this stanza the image's declared VOLUME still gets
      # one, but anonymously: `docker compose down` orphans it under a hash nobody can
      # identify, and the next `up` starts on an empty database. A named volume survives
      # `down` and is removed only by `down -v`.
      - horopter-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horopter"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    # The tag after :- is the published version this stack runs. Bump it in the commit the
    # tag is cut from, so the tagged tree names the images that tag builds; bumping it
    # afterwards leaves the release pointing at the version before it. Set HOROPTER_IMAGE_TAG
    # in the environment to override it for one run; `task up:local` bypasses both and runs
    # images built from the working tree.
    image: ghcr.io/horopter-dev/horopter-migrate:${HOROPTER_IMAGE_TAG:-v0.1.0}
    environment:
      DATABASE_URL: postgres://horopter:horopter@db:5432/horopter?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  ingress:
    image: ghcr.io/horopter-dev/horopter-ingress:${HOROPTER_IMAGE_TAG:-v0.1.0}
    environment:
      DATABASE_URL: postgres://horopter:horopter@db:5432/horopter?sslmode=disable
      HOROPTER_INGRESS_TOKEN: local-dev-token
      HOROPTER_ADDR: 0.0.0.0:8080
      OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
    ports:
      - "8080:8080"
      # Loopback only on the host side. The API ports publish on every interface, which the
      # security review already reports; the metrics port does not add to it.
      - "127.0.0.1:9464:9464"
    depends_on:
      migrate:
        condition: service_completed_successfully

  egress:
    image: ghcr.io/horopter-dev/horopter-egress:${HOROPTER_IMAGE_TAG:-v0.1.0}
    environment:
      DATABASE_URL: postgres://horopter:horopter@db:5432/horopter?sslmode=disable
      HOROPTER_ADDR: 0.0.0.0:8081
      OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
    ports:
      - "8081:8081"
      # The container keeps the default 9464; the host side is 9465 so it does not clash
      # with ingress's. Loopback only, as for ingress.
      - "127.0.0.1:9465:9464"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  horopter-db-data:
