version: '3'
tasks:
  db:up:
    cmds:
      - docker compose up -d db
  db:down:
    cmds:
      - docker compose down -v
  test:
    preconditions:
      - sh: 'docker compose exec -T db pg_isready -U horopter'
        msg: 'the database is not reachable; start it with `task db:up` and retry'
    env:
      HOROPTER_TEST_DSN: postgres://horopter:horopter@localhost:5432/horopter
    cmds:
      - go test -race -count=1 {{.CLI_ARGS | default "./..."}}
  lint:
    cmds:
      - golangci-lint run ./...
  build:
    cmds:
      - go build -o dist/horopter-ingress ./cmd/horopter-ingress
      - go build -o dist/horopter-egress ./cmd/horopter-egress
      - go build -o dist/horopter-migrate ./cmd/horopter-migrate
  up:
    cmds:
      - docker compose pull
      - docker compose up -d
  up:local:
    cmds:
      - goreleaser release --snapshot --clean
      - ./hack/snapshot-override.sh
      - docker compose -f docker-compose.yml -f docker-compose.snapshot.yml up -d
  stop:
    cmds:
      - docker compose stop
  down:
    cmds:
      - docker compose down -v
  logs:
    cmds:
      - docker compose logs -f ingress egress
  seed:
    cmds:
      - ./hack/seed.sh
  fmt:
    cmds:
      - gofmt -l .
      - test -z "$(gofmt -l .)"
  check:
    cmds:
      - task: fmt
      - task: lint
      - task: test
