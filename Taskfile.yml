version: '3'
tasks:
  test:
    cmds:
      - go test ./... -race -count=1
  lint:
    cmds:
      - golangci-lint run ./...
  build:
    cmds:
      - go build -o horopter ./cmd/horopter
  fmt:
    cmds:
      - gofmt -l .
      - test -z "$(gofmt -l .)"
  check:
    cmds:
      - task: fmt
      - task: lint
      - task: test
