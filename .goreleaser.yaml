version: 2
project_name: horopter

before:
  hooks:
    - go mod tidy -diff
    - ./hack/render-compose.sh {{ .Tag }}

builds:
  - id: ingress
    main: ./cmd/horopter-ingress
    binary: horopter-ingress
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Every build stamps the release, without the tag's v, where buildinfo.Version reads it;
    # the kos inherit it. Setting ldflags replaces GoReleaser's defaults, so -s -w is restated.
    ldflags: &ldflags ["-s -w -X horopter.dev/horopter/internal/buildinfo.version={{ .Version }}"]
  - id: egress
    main: ./cmd/horopter-egress
    binary: horopter-egress
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: horopter-migrate
    main: ./cmd/horopter-migrate
    binary: horopter-migrate
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: horopter-flux
    main: ./cmd/horopter-flux
    binary: horopter-flux
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  # horoctl is the first binary here needing a non-Linux target: ingress, egress and
  # horopter-migrate exist to become container images, but operators run horoctl from a
  # laptop. darwin/amd64 is excluded rather than built and left unpublished.
  - id: horoctl
    main: ./cmd/horoctl
    binary: horoctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags: [-trimpath]
    ldflags: *ldflags
  - id: horo
    main: ./cmd/horo
    binary: horo
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags: [-trimpath]
    ldflags: *ldflags

# ko compiles each platform and pushes an OCI index straight to the registry: no Dockerfile,
# no buildx builder, no QEMU, no daemon. Three settings are explicit because ko's defaults are
# wrong here: platforms (it defaults to linux/amd64 alone and says nothing when it does), user
# (the docs do not say whether the base image's USER is inherited), and bare with
# preserve_import_paths, without which ko appends the Go import path to the repository.
kos:
  - id: ingress
    build: ingress
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    user: "65532:65532"
    repositories: [ghcr.io/horopter-dev/horopter-ingress]
    local_domain: goreleaser.ko.local/horopter-ingress
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Tag }}"]
    bare: true
    preserve_import_paths: false
    sbom: spdx
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
  - id: egress
    build: egress
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    user: "65532:65532"
    repositories: [ghcr.io/horopter-dev/horopter-egress]
    local_domain: goreleaser.ko.local/horopter-egress
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Tag }}"]
    bare: true
    preserve_import_paths: false
    sbom: spdx
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
  - id: horopter-migrate
    build: horopter-migrate
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    user: "65532:65532"
    repositories: [ghcr.io/horopter-dev/horopter-migrate]
    local_domain: goreleaser.ko.local/horopter-migrate
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Tag }}"]
    bare: true
    preserve_import_paths: false
    sbom: spdx
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
  - id: horopter-flux
    build: horopter-flux
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    user: "65532:65532"
    repositories: [ghcr.io/horopter-dev/horopter-flux]
    local_domain: goreleaser.ko.local/horopter-flux
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Tag }}"]
    bare: true
    preserve_import_paths: false
    sbom: spdx
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
  # horoctl's compose-stack use (the bootstrap service) is the container image; the
  # darwin/arm64 build above never reaches here — kos only ever produces Linux images.
  - id: horoctl
    build: horoctl
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    user: "65532:65532"
    repositories: [ghcr.io/horopter-dev/horoctl]
    local_domain: goreleaser.ko.local/horoctl
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Tag }}"]
    bare: true
    preserve_import_paths: false
    sbom: spdx
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

archives:
  # Two archives, not one: horoctl builds for darwin/arm64 too, and goreleaser refuses one
  # archive definition covering platforms with different binary counts. Both need an
  # explicit name_template — their default names collide on every linux platform, since
  # both otherwise render "horopter_<version>_<os>_<arch>".
  - id: binaries
    ids: [ingress, egress, horopter-migrate]
    formats: [tar.gz]
    name_template: "horopter_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: horoctl
    ids: [horoctl]
    formats: [tar.gz]
    name_template: "horoctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: horo
    ids: [horo]
    formats: [tar.gz]
    name_template: "horo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# One cask per CLI, each from its own archive: a cask matching two archives on one platform is
# refused. skip_upload: auto keeps a prerelease out of the tap. The binaries are unsigned, so
# each cask clears the quarantine bit.
homebrew_casks:
  - name: horo
    ids: [horo]
    description: Records changes and reads them back
    homepage: https://docs.horopter.dev/
    skip_upload: auto
    repository: &tap
      owner: horopter-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/horo"]
          end
  - name: horoctl
    ids: [horoctl]
    description: Manages Horopter tenants and credentials and applies migrations
    homepage: https://docs.horopter.dev/
    skip_upload: auto
    repository: *tap
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/horoctl"]
          end

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  # Release Please creates the release as a draft carrying its changelog, and pushes the tag
  # that runs this (.github/workflows/release-please.yaml). GoReleaser reuses that draft and
  # publishes it in one EditRelease call by setting draft to false, rather than creating a
  # second release; a separate un-draft step published the wrong one in yo61/go-udap when two
  # drafts coexisted.
  draft: false
  use_existing_draft: true
  # Any tag containing a hyphen (v0.1.0-dev.1, say) is a semver prerelease, so it publishes
  # as a GitHub prerelease and never becomes "Latest" — the whole point of the dev-tag scheme.
  prerelease: auto
  extra_files:
    - glob: .render/docker-compose.yaml
