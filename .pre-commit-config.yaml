repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: go-test
        name: go test
        entry: go test ./... -count=1
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: go-fmt
        name: gofmt
        entry: bash -c 'f=$(gofmt -l .); if [ -n "$f" ]; then echo "gofmt needed:"; echo "$f"; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]
