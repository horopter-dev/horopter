# conventional-pre-commit runs at the commit-msg stage, and `prek install` wires only the
# pre-commit shim unless told otherwise. Without this key a fresh clone gets no commit-message
# linting at all, and CI does not check messages either -- so a malformed type, which is what
# picks the next version number, would have nothing to catch it.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A unified diff's blank context line is a single space, so trimming it corrupts the
      # mutation battery's patches; git apply then refuses them.
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: go-test
        name: go test
        entry: task test
        language: system
        pass_filenames: false
        # Without this the suite runs on every commit, and `task test` needs the Postgres
        # container up -- so a docs- or Taskfile-only commit fails on a precondition it
        # cannot affect. pass_filenames stays false: the trigger is narrowed, the run is
        # still the whole suite.
        files: (\.go$|^go\.(mod|sum)$)
        stages: [pre-commit]
      - id: go-fmt
        name: gofmt
        entry: task fmt
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        pass_filenames: false
        stages: [pre-commit]
