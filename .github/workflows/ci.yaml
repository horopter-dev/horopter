name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push supersedes the run already in flight for the same ref, so a branch pushed twice
# in quick succession does not hold a Postgres service container open for the older
# commit's run as well as the newer one's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint and test
    # Pinned rather than ubuntu-latest, so a new image arrives as a Renovate pull
    # request instead of GitHub's switch.
    runs-on: ubuntu-26.04
    # The suite is seconds and the whole job a few minutes. Without a bound, a service
    # container that never reports healthy wedges the job for the six-hour default.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: horopter
          POSTGRES_PASSWORD: horopter
          POSTGRES_DB: horopter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horopter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      HOROPTER_TEST_DSN: postgres://horopter:horopter@localhost:5432/horopter
      DATABASE_URL: postgres://horopter:horopter@localhost:5432/horopter
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The battery needs a database and runs by hand, so a change that moves the code a patch
      # mutates would otherwise break it unseen. This fails that pull request instead.
      - name: Check every mutation patch still applies
        run: |
          set -euo pipefail
          failed=0
          for patch in reviews/mutations/*/*.patch; do
            if ! git apply --check "$patch" 2> /dev/null; then
              echo "::error file=${patch}::no longer applies; re-derive it against the current code"
              failed=1
            fi
          done
          exit "$failed"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: |
          set -euo pipefail
          go mod tidy -diff

      - name: Build
        run: |
          set -euo pipefail
          go build ./...

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...

      # Fails on a known vulnerability the code can reach, in a module or in the standard
      # library of the Go that go.mod names, which Dependabot does not update.
      - name: Check for known vulnerabilities
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.9.0
        run: |
          set -euo pipefail
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        env:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          GOLANGCI_LINT_VERSION: v2.15.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # jactionlint checks this workflow itself. It was part of the branch's verified state
      # while being run by hand, which made it true only for as long as somebody remembered;
      # running it here is what makes it a gate.
      - name: Lint workflows
        env:
          # renovate: datasource=go depName=github.com/jdx/jactionlint/v2
          JACTIONLINT_VERSION: v2.2.0
          # jactionlint's online rules, which replace zizmor's online audits.
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go install "github.com/jdx/jactionlint/v2/cmd/jactionlint@${JACTIONLINT_VERSION}"
          jactionlint

      - name: Apply database migrations
        run: |
          set -euo pipefail
          # DATABASE_URL comes from the job's env: block above, not this script.
          # shellcheck disable=SC2154
          go run ./cmd/horopter-migrate -dsn "$DATABASE_URL"

      - name: Test
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

      - name: Test the read expansion factor without the race detector
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestReadAllocationsStayWithinExpansionFactor$' \
            ./internal/egress | tee /tmp/expansion.log
          # A renamed test makes -run match nothing: go test still exits 0 and prints "ok",
          # so this grep is what turns that into a step failure instead of a silent pass.
          grep -q -- '--- PASS: TestReadAllocationsStayWithinExpansionFactor ' /tmp/expansion.log

  release-check:
    name: Check the release configuration
    # Pinned rather than ubuntu-latest, so a new image arrives as a Renovate pull
    # request instead of GitHub's switch.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Two commits, so a pull request's merge commit has its base, HEAD^1, to diff against.
          fetch-depth: 2

      # Nothing below reads Markdown, so a pull request changing only *.md skips it. The test
      # job still runs: docs/reference_test.go checks the reference pages against the code.
      - name: Find whether anything but Markdown changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            while IFS= read -r path; do
              case "$path" in
                *.md) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Release configuration and shell checks run: $code"

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache in a job that pairs with goreleaser-action: jactionlint's
          # cache-poisoning rule, and its documented remedy.
          cache: false

      - name: Install GoReleaser
        if: steps.changes.outputs.code == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        env:
          # A nightly until v2.19.0, for the casks' install_steps (HOR-121). GoReleaser keeps
          # about a week of nightlies, so bump it by hand before this one is pruned (HOR-122).
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          GORELEASER_VERSION: v2.19.0-4a71e1e8-nightly
        with:
          distribution: goreleaser
          # Exact, not '~> v2': this is the tool that builds the released artefacts, so a
          # range would let two horopter tags be produced by different builders with nothing
          # in the repository recording which.
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      # A broken release config should fail on the pull request, not on the tag, when the
      # only way to retry is another tag.
      - name: Check the release configuration
        if: steps.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          goreleaser check

      - name: Build the release artefacts without publishing
        if: steps.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          goreleaser release --snapshot --clean

      # shellcheck and shfmt are both installed at a pinned version rather than taken from
      # the runner image. Ubuntu 24.04 ships shellcheck 0.9.0 against 0.11.0 upstream, so
      # relying on the image would let the OS decide which lint rules apply to hack/*.sh --
      # and would change them silently whenever the runner label moves. The sha256 is
      # verified because a release asset can be replaced in place; a changed artefact fails
      # here rather than running. It unpacks into RUNNER_TEMP so nothing lands in the
      # checkout.
      - name: Lint the shell scripts
        if: steps.changes.outputs.code == 'true'
        env:
          # Not annotated for Renovate: a new version needs its checksum too, by hand.
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          # renovate: datasource=go depName=mvdan.cc/sh/v3
          SHFMT_VERSION: v3.14.1
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" -C "${RUNNER_TEMP}" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck_bin="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$shellcheck_bin" --version
          "$shellcheck_bin" hack/*.sh
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          shfmt -i 2 -bn -ci -sr -d hack/*.sh
