name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A tag pushed again (a retry, or a corrected tag) supersedes the run already building and
# publishing images for the tag it replaces, rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build images and cut the release
    # Pinned rather than ubuntu-latest, so a new image arrives as a Renovate pull
    # request instead of GitHub's switch.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # A job-level block replaces the top-level one rather than adding to it, so contents
    # is restated here.
    permissions:
      contents: write # creates the GitHub release and uploads its assets
      packages: write # pushes the built images to GHCR
    steps:
      # First, before a checkout, a login or any credential setup: a tag can be pushed to
      # any commit, reviewed or not, and this job holds contents:write and packages:write.
      # The Stage 1 design called tags-are-cut-from-main "a convention, not a gate"
      # (docs/superpowers/specs/2026-09-17-container-images-and-compose-stack-design.md,
      # risk 2). This is the gate.
      #
      # Asked of the API rather than with `git merge-base`: the checkout below sets
      # persist-credentials: false, so a later `git fetch origin main` has no credentials
      # on a private repository, and relying on checkout having populated origin/main is
      # relying on undocumented behaviour for a tag ref.
      #
      # compare/BASE...HEAD reports HEAD's relation to BASE. A tag on main is either
      # `identical` (the tip) or `behind` (an ancestor). `ahead` or `diverged` means the
      # commit is not on main.
      - name: Refuse a tag that is not on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            identical | behind)
              echo "Tagged commit ${GITHUB_SHA} is on main (${status})."
              ;;
            *)
              echo "::error::Tagged commit ${GITHUB_SHA} is not on main (compare status:" \
                "${status}). Tags are cut from main, which CI has tested. Nothing was" \
                "built or published."
              exit 1
              ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # GoReleaser reads the history and the tags to build a changelog and to know
          # which version it is releasing; a shallow clone has neither.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # This job publishes images and a release; an attacker able to poison the module
          # or build cache could taint what gets published. The cache buys little here — the
          # job runs once per tag — so it stays off rather than risk that.
          cache: false

      # GITHUB_TOKEN cannot write to another repository, so the casks are pushed to the tap
      # with a token from the org's release App, scoped to the tap's contents alone.
      - name: Mint a token for the Homebrew tap
        id: tap_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ko reads Docker's keychain for the credentials the step above wrote. It needs no
      # buildx builder and no QEMU: each platform is a Go cross-compile, and the index is
      # pushed through the registry API.
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          # Exact, not '~> v2'. The CI release-check job pins the same version, so what
          # validates the config on a pull request is what builds the artefacts on the tag.
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          GORELEASER_VERSION: v2.18.2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token }}
