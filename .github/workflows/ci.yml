name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push supersedes the run already in flight for the same ref, so a branch pushed twice
# in quick succession does not hold a Postgres service container open for the older
# commit's run as well as the newer one's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    # The suite is seconds and the whole job a few minutes. Without a bound, a service
    # container that never reports healthy wedges the job for the six-hour default.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: horopter
          POSTGRES_PASSWORD: horopter
          POSTGRES_DB: horopter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horopter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      HOROPTER_TEST_DSN: postgres://horopter:horopter@localhost:5432/horopter
      DATABASE_URL: postgres://horopter:horopter@localhost:5432/horopter
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: |
          set -euo pipefail
          go mod tidy -diff

      - name: Build
        run: |
          set -euo pipefail
          go build ./...

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.13.2

      # actionlint and zizmor check this workflow itself. They were part of the branch's
      # verified state while being run by hand, which made them true only for as long as
      # somebody remembered; running them here is what makes them a gate.
      - name: Lint workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: 1.30.1
          inputs: .github/workflows/
          # This repository has no GitHub Advanced Security, so SARIF upload would fail.
          # Annotations are mutually exclusive with it and are what a reviewer sees.
          advanced-security: false
          annotations: true

      - name: Apply database migrations
        run: |
          set -euo pipefail
          # DATABASE_URL comes from the job's env: block above, not this script.
          # shellcheck disable=SC2154
          go run ./cmd/horopter-migrate -dsn "$DATABASE_URL"

      - name: Test
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

      - name: Test the read expansion factor without the race detector
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestReadAllocationsStayWithinExpansionFactor$' \
            ./internal/egress | tee /tmp/expansion.log
          # A renamed test makes -run match nothing: go test still exits 0 and prints "ok",
          # so this grep is what turns that into a step failure instead of a silent pass.
          grep -q -- '--- PASS: TestReadAllocationsStayWithinExpansionFactor ' /tmp/expansion.log

  release-check:
    name: Check the release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache in a job that pairs with goreleaser-action: zizmor's
          # cache-poisoning audit, and its documented remedy.
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      # A broken release config should fail on the pull request, not on the tag, when the
      # only way to retry is another tag.
      - name: Check the release configuration
        run: |
          set -euo pipefail
          goreleaser check

      - name: Build the release artefacts without publishing
        run: |
          set -euo pipefail
          goreleaser release --snapshot --clean

      - name: Lint the shell scripts
        run: |
          set -euo pipefail
          shellcheck hack/*.sh
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          shfmt -i 2 -bn -ci -sr -d hack/*.sh

      # Nothing else parses the released compose file. HOROPTER_IMAGE_TAG is set to a literal
      # here only so `config` has something to substitute; the file itself is unrendered.
      - name: Check the deploy compose file
        run: |
          set -euo pipefail
          HOROPTER_IMAGE_TAG=v0.0.0-ci docker compose -f deploy/docker-compose.yml config -q
